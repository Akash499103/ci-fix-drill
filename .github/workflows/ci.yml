name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # FIX: npm ci uses the committed lockfile for reproducible CI installs.
        run: npm ci

  test:
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # FIX: GitHub Actions jobs use separate machines, so the test job
        # must install its own dependencies even though it waits for install.
        run: npm ci

      - name: Run tests
        run: npm test

